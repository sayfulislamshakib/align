<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    html, body {
      overflow: hidden;
      height: auto;
      scrollbar-width: none;
    }

    ::-webkit-scrollbar {
      display: none;
    }

    body {
      background: #2c2c2c;
      color: #ffffff;
      font-size: 11px;
      user-select: none;
    }

    #app {
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* Row 1: Vertical Move -> Target Selection Bar */
    .selection-bar {
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: relative;
    }

    .node-pill {
      width: 100%;
      height: 24px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 28px 0 6px;
      border-radius: 5px;
      background: #383838;
    }

    .pill-tag {
      font-size: 9px;
      font-weight: 600;
      padding: 1px 4px;
      border-radius: 3px;
      letter-spacing: 0.02em;
      flex-shrink: 0;
      text-transform: uppercase;
      min-width: 28px;
      text-align: center;
    }

    .pill-tag.move {
      background: rgba(13, 153, 255, 0.22);
      color: #7cc4fa;
    }

    .pill-tag.anchor {
      background: #444444;
      color: #cccccc;
    }

    .node-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 500;
      color: #f0f0f0;
    }

    .node-name.empty {
      color: #777777;
      font-weight: 400;
    }

    .swap-btn {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      width: 22px;
      height: 22px;
      background: #2c2c2c;
      border: 1px solid #4a4a4a;
      border-radius: 4px;
      color: #cccccc;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.12s ease;
      z-index: 2;
    }

    .swap-btn:hover:not(:disabled) {
      background: #4a4a4a;
      border-color: #5a5a5a;
      color: #ffffff;
    }

    .swap-btn:active:not(:disabled) {
      background: #0d99ff;
      border-color: #0d99ff;
      color: #ffffff;
    }

    .swap-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .swap-btn svg {
      width: 13px;
      height: 13px;
      fill: none;
    }

    /* Row 2: Figma 3x3 Alignment Matrix Box */
    .figma-matrix-box {
      background: #383838;
      border-radius: 6px;
      padding: 4px 10px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 18px);
      align-items: center;
      justify-items: center;
    }

    .matrix-cell {
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .matrix-cell:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .matrix-dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #8c8c8c;
    }

    .matrix-bars {
      width: 14px;
      height: 14px;
      display: none;
      fill: #7cc4fa;
    }

    .matrix-cell.active .matrix-dot,
    .matrix-cell:hover:not(:disabled) .matrix-dot {
      display: none;
    }

    .matrix-cell.active .matrix-bars,
    .matrix-cell:hover:not(:disabled) .matrix-bars {
      display: block;
    }

    .matrix-cell:hover:not(:disabled):not(.active) .matrix-bars {
      opacity: 0.75;
    }

    /* Row 3: Gap Control */
    .gap-bar {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .gap-input-wrap {
      display: flex;
      align-items: center;
      background: #383838;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 0 6px;
      height: 28px;
      flex: 1;
      min-width: 0;
      transition: border-color 0.12s, background 0.12s;
    }

    .gap-input-wrap:hover {
      border-color: #4d4d4d;
    }

    .gap-input-wrap:focus-within {
      background: #242424;
      border-color: #0d99ff;
    }

    .gap-scrub-handle {
      display: flex;
      align-items: center;
      color: #999999;
      cursor: ew-resize;
      margin-right: 4px;
      flex-shrink: 0;
    }

    .gap-scrub-handle:hover {
      color: #dcdcdc;
    }

    .gap-icon {
      width: 14px;
      height: 14px;
      fill: none;
    }

    .gap-input {
      width: 100%;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 11px;
      font-weight: 500;
    }

    .gap-unit {
      font-size: 10px;
      color: #777777;
      margin-left: 3px;
      flex-shrink: 0;
    }

    .gap-segmented {
      display: flex;
      align-items: center;
      background: #383838;
      border-radius: 6px;
      padding: 2px;
      gap: 2px;
      flex-shrink: 0;
    }

    .gap-btn {
      height: 24px;
      padding: 0 6px;
      background: transparent;
      border: none;
      border-radius: 4px;
      color: #e5e5e5;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 3px;
      transition: background 0.1s ease, color 0.1s ease;
    }

    .gap-btn:hover:not(:disabled) {
      background: #4d4d4d;
      color: #ffffff;
    }

    .gap-btn:active:not(:disabled) {
      background: #0d99ff;
      color: #ffffff;
    }

    .gap-btn:disabled {
      opacity: 0.32;
      cursor: not-allowed;
    }

    .gap-btn svg {
      width: 14px;
      height: 14px;
      fill: none;
    }
  </style>
</head>
<body>
  <!-- Shared SVG definitions for the 3x3 matrix bars -->
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <g id="bars-top">
        <rect x="3.2" y="2.5" width="2.4" height="9" rx="1.2" />
        <rect x="7.8" y="2.5" width="2.4" height="13" rx="1.2" />
        <rect x="12.4" y="2.5" width="2.4" height="6.5" rx="1.2" />
      </g>
      <g id="bars-mid">
        <rect x="3.2" y="4.5" width="2.4" height="9" rx="1.2" />
        <rect x="7.8" y="2.5" width="2.4" height="13" rx="1.2" />
        <rect x="12.4" y="5.75" width="2.4" height="6.5" rx="1.2" />
      </g>
      <g id="bars-bot">
        <rect x="3.2" y="6.5" width="2.4" height="9" rx="1.2" />
        <rect x="7.8" y="2.5" width="2.4" height="13" rx="1.2" />
        <rect x="12.4" y="9" width="2.4" height="6.5" rx="1.2" />
      </g>
    </defs>
  </svg>

  <div id="app">
    <!-- Row 1: Vertical Selection Bar -->
    <div class="selection-bar">
      <div class="node-pill" id="first-pill" title="1st selected (Moves)">
        <span class="pill-tag move" id="first-tag">1st</span>
        <span id="first-name" class="node-name empty">Select layer</span>
      </div>
      <button id="swap-btn" class="swap-btn" disabled title="Swap 1st & 2nd">
        <svg viewBox="0 0 24 24">
          <path d="M8.75 4.75V19.25M8.75 4.75L5.25 8.25M8.75 4.75L12.25 8.25M15.25 19.25V4.75M15.25 19.25L11.75 15.75M15.25 19.25L18.75 15.75" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <div class="node-pill" id="second-pill" title="2nd selected (Target)">
        <span class="pill-tag anchor" id="second-tag">2nd</span>
        <span id="second-name" class="node-name empty">Target layer</span>
      </div>
    </div>

    <!-- Row 2: Figma Default 3x3 Alignment Grid Box -->
    <div class="figma-matrix-box" id="matrix-box">
      <button class="matrix-cell" data-dir="top-left" disabled title="Align Top Left"><span class="matrix-dot"></span><svg class="matrix-bars" viewBox="0 0 18 18"><use href="#bars-top" /></svg></button>
      <button class="matrix-cell" data-dir="top-center" disabled title="Align Top Center"><span class="matrix-dot"></span><svg class="matrix-bars" viewBox="0 0 18 18"><use href="#bars-top" /></svg></button>
      <button class="matrix-cell" data-dir="top-right" disabled title="Align Top Right"><span class="matrix-dot"></span><svg class="matrix-bars" viewBox="0 0 18 18"><use href="#bars-top" /></svg></button>
      <button class="matrix-cell" data-dir="center-left" disabled title="Align Center Left"><span class="matrix-dot"></span><svg class="matrix-bars" viewBox="0 0 18 18"><use href="#bars-mid" /></svg></button>
      <button class="matrix-cell active" data-dir="center" disabled title="Align Center"><span class="matrix-dot"></span><svg class="matrix-bars" viewBox="0 0 18 18"><use href="#bars-mid" /></svg></button>
      <button class="matrix-cell" data-dir="center-right" disabled title="Align Center Right"><span class="matrix-dot"></span><svg class="matrix-bars" viewBox="0 0 18 18"><use href="#bars-mid" /></svg></button>
      <button class="matrix-cell" data-dir="bottom-left" disabled title="Align Bottom Left"><span class="matrix-dot"></span><svg class="matrix-bars" viewBox="0 0 18 18"><use href="#bars-bot" /></svg></button>
      <button class="matrix-cell" data-dir="bottom-center" disabled title="Align Bottom Center"><span class="matrix-dot"></span><svg class="matrix-bars" viewBox="0 0 18 18"><use href="#bars-bot" /></svg></button>
      <button class="matrix-cell" data-dir="bottom-right" disabled title="Align Bottom Right"><span class="matrix-dot"></span><svg class="matrix-bars" viewBox="0 0 18 18"><use href="#bars-bot" /></svg></button>
    </div>

    <!-- Row 3: Gap Control -->
    <div class="gap-bar">
      <div class="gap-input-wrap" title="Drag icon to scrub, or type a value and press Enter">
        <div class="gap-scrub-handle">
          <svg class="gap-icon" viewBox="0 0 24 24">
            <path d="M4.75 4.75V19.25M19.25 4.75V19.25M8.75 12H15.25" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
        <input id="gap-input" class="gap-input" type="text" inputmode="numeric" value="0" spellcheck="false" autocomplete="off" />
        <span class="gap-unit">px</span>
      </div>
      <div class="gap-segmented">
        <button class="gap-btn" data-axis="h" disabled title="Apply Horizontal Gap">
          <svg viewBox="0 0 24 24">
            <path d="M3.75 4.75V19.25M20.25 4.75V19.25M7.75 12H16.25M7.75 12L10.25 9.5M7.75 12L10.25 14.5M16.25 12L13.75 9.5M16.25 12L13.75 14.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          H
        </button>
        <button class="gap-btn" data-axis="v" disabled title="Apply Vertical Gap">
          <svg viewBox="0 0 24 24">
            <path d="M4.75 3.75H19.25M4.75 20.25H19.25M12 7.75V16.25M12 7.75L9.5 10.25M12 7.75L14.5 10.25M12 16.25L9.5 13.75M12 16.25L14.5 13.75" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          V
        </button>
      </div>
    </div>
  </div>

  <script>
    const firstNameEl = document.getElementById("first-name");
    const secondNameEl = document.getElementById("second-name");
    const firstTagEl = document.getElementById("first-tag");
    const secondTagEl = document.getElementById("second-tag");
    const firstPillEl = document.getElementById("first-pill");
    const secondPillEl = document.getElementById("second-pill");
    const swapBtn = document.getElementById("swap-btn");
    const gapInput = document.getElementById("gap-input");
    const gapScrubHandle = document.querySelector(".gap-scrub-handle");
    const gapInputWrap = document.querySelector(".gap-input-wrap");
    const gapBtns = document.querySelectorAll(".gap-btn");
    const matrixCells = document.querySelectorAll(".matrix-cell");
    let hasValidPair = false;

    const post = (pluginMessage) => parent.postMessage({ pluginMessage }, "*");

    function setActiveMatrixSpot(dir) {
      matrixCells.forEach((cell) => {
        cell.classList.toggle("active", cell.getAttribute("data-dir") === dir);
      });
    }

    function cleanNumericString(raw) {
      let s = raw.replace(/[^0-9.-]/g, "");
      const isNeg = s.startsWith("-");
      s = s.replace(/-/g, "");
      const parts = s.split(".");
      if (parts.length > 2) s = parts[0] + "." + parts.slice(1).join("");
      return (isNeg ? "-" : "") + s;
    }

    function getGapValue() {
      const val = parseFloat(gapInput.value);
      return isNaN(val) ? 0 : val;
    }

    function normalizeGapInput() {
      const val = getGapValue();
      gapInput.value = String(val);
      return val;
    }

    matrixCells.forEach((cell) => {
      cell.addEventListener("click", () => {
        const direction = cell.getAttribute("data-dir");
        setActiveMatrixSpot(direction);
        normalizeGapInput();
        post({ type: "align", direction });
      });
    });

    gapBtns.forEach((btn) => {
      btn.addEventListener("click", () => {
        post({ type: "apply-gap", axis: btn.getAttribute("data-axis"), gap: normalizeGapInput() });
      });
    });

    let justFocused = false;
    gapInput.addEventListener("focus", () => {
      justFocused = true;
      setTimeout(() => gapInput.select(), 0);
    });

    gapInput.addEventListener("mouseup", (e) => {
      if (justFocused) {
        e.preventDefault();
        justFocused = false;
      }
    });

    gapInput.addEventListener("blur", normalizeGapInput);

    gapInput.addEventListener("input", () => {
      const cleaned = cleanNumericString(gapInput.value);
      if (gapInput.value !== cleaned) gapInput.value = cleaned;
    });

    gapInputWrap.addEventListener("click", (e) => {
      if (e.target !== gapInput && !gapScrubHandle.contains(e.target)) {
        gapInput.focus();
        gapInput.select();
      }
    });

    let scrubStartX = 0;
    let scrubStartVal = 0;
    let isScrubbing = false;

    gapScrubHandle.addEventListener("mousedown", (e) => {
      e.preventDefault();
      isScrubbing = true;
      scrubStartX = e.clientX;
      scrubStartVal = getGapValue();
      document.body.style.cursor = "ew-resize";
    });

    window.addEventListener("mousemove", (e) => {
      if (!isScrubbing) return;
      const step = e.shiftKey ? 10 : 1;
      const nextVal = scrubStartVal + Math.round((e.clientX - scrubStartX) / 2) * step;
      gapInput.value = String(nextVal);
      if (hasValidPair) post({ type: "apply-gap", axis: "auto", gap: nextVal });
    });

    window.addEventListener("mouseup", () => {
      if (isScrubbing) {
        isScrubbing = false;
        document.body.style.cursor = "";
      }
    });

    gapInput.addEventListener("keydown", (e) => {
      if (e.key === "ArrowUp" || e.key === "ArrowDown") {
        e.preventDefault();
        const step = e.shiftKey ? 10 : 1;
        const nextVal = getGapValue() + (e.key === "ArrowUp" ? step : -step);
        gapInput.value = String(nextVal);
        gapInput.select();
        if (hasValidPair) post({ type: "apply-gap", axis: "auto", gap: nextVal });
      } else if (e.key === "Enter") {
        post({ type: "apply-gap", axis: "auto", gap: normalizeGapInput() });
        gapInput.select();
      }
    });

    swapBtn.addEventListener("click", () => post({ type: "swap-order" }));

    window.onmessage = (event) => {
      const msg = event.data && event.data.pluginMessage;
      if (!msg || msg.type !== "selection-updated") return;

      const isParentMode = msg.mode === "parent";
      firstTagEl.textContent = isParentMode ? "Item" : "1st";
      secondTagEl.textContent = isParentMode ? "Frame" : "2nd";

      if (msg.first) {
        firstNameEl.textContent = msg.first.name;
        firstPillEl.title = isParentMode
          ? `Moving inside parent: ${msg.first.name}`
          : `1st selected (Moves): ${msg.first.name}`;
        firstNameEl.classList.remove("empty");
      } else {
        firstNameEl.textContent = "Select layer";
        firstPillEl.title = "1st selected (Moves)";
        firstNameEl.classList.add("empty");
      }

      if (msg.second) {
        secondNameEl.textContent = msg.second.name;
        secondPillEl.title = isParentMode
          ? `Parent Frame Target: ${msg.second.name}`
          : `2nd selected (Target): ${msg.second.name}`;
        secondNameEl.classList.remove("empty");
      } else {
        secondNameEl.textContent = "Target layer";
        secondPillEl.title = "2nd selected (Target)";
        secondNameEl.classList.add("empty");
      }

      if (msg.activeSpot) setActiveMatrixSpot(msg.activeSpot);

      gapInputWrap.title = msg.gapInfo
        ? `${msg.gapInfo.inside ? "Inner inset" : "Current gap"} — H: ${msg.gapInfo.h}px, V: ${msg.gapInfo.v}px (Drag icon to scrub)`
        : "Drag icon to scrub, or type a value and press Enter";

      hasValidPair = Boolean(msg.first && msg.second);
      swapBtn.disabled = !hasValidPair || msg.canSwap === false;
      swapBtn.title =
        hasValidPair && msg.canSwap === false
          ? "Target cannot be moved"
          : isParentMode
            ? "Switch to 1st ⇄ 2nd alignment"
            : "Swap 1st & 2nd (or cycle Parent alignment)";

      matrixCells.forEach((cell) => (cell.disabled = !hasValidPair));
      gapBtns.forEach((btn) => (btn.disabled = !hasValidPair));
    };

    const appEl = document.getElementById("app");
    function fitWindowToContent() {
      const height = Math.ceil(appEl.getBoundingClientRect().height);
      if (height > 0) post({ type: "resize", height });
    }

    fitWindowToContent();
    if (typeof ResizeObserver !== "undefined") {
      new ResizeObserver(fitWindowToContent).observe(appEl);
    }
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(fitWindowToContent);
    }
    window.addEventListener("load", fitWindowToContent);

    post({ type: "ui-ready" });
  </script>
</body>
</html>
